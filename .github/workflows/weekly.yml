name: Starlink Weekly Automation
run-name: Starlink Weekly Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

concurrency:
  group: weekly-starlink-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test official item parsers
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate environment
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITEE_REMOTE: ${{ secrets.GITEE_REMOTE }}
        run: python scripts/validate_env.py

      - name: Run weekly automation
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DETAIL_RENDER_MODE: ${{ vars.DETAIL_RENDER_MODE || 'auto' }}
          MAX_RENDERED_DETAILS_PER_SOURCE: ${{ vars.MAX_RENDERED_DETAILS_PER_SOURCE || '10' }}
          DETAIL_TIMEOUT_MS: ${{ vars.DETAIL_TIMEOUT_MS || '30000' }}
          DETAIL_WAIT_MS: ${{ vars.DETAIL_WAIT_MS || '1500' }}
          DETAIL_MAX_SCROLLS: ${{ vars.DETAIL_MAX_SCROLLS || '3' }}
          DETAIL_CONCURRENCY: ${{ vars.DETAIL_CONCURRENCY || '1' }}
          LONG_ABSENCE_OBSERVATION_THRESHOLD: ${{ vars.LONG_ABSENCE_OBSERVATION_THRESHOLD || '4' }}
          LONG_ABSENCE_MIN_DAYS: ${{ vars.LONG_ABSENCE_MIN_DAYS || '14' }}
          DETAIL_FAILURE_ATTENTION_THRESHOLD: ${{ vars.DETAIL_FAILURE_ATTENTION_THRESHOLD || '3' }}
          MAX_ITEM_VERSIONS_PER_RECORD: ${{ vars.MAX_ITEM_VERSIONS_PER_RECORD || '20' }}
          MAX_LIFECYCLE_EVENTS: ${{ vars.MAX_LIFECYCLE_EVENTS || '1000' }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '24' }}
          MAX_ALERT_EVENTS: ${{ vars.MAX_ALERT_EVENTS || '2000' }}
          MAX_PROCESSED_ALERT_EVENT_IDS: ${{ vars.MAX_PROCESSED_ALERT_EVENT_IDS || '2000' }}
          MAX_RUN_HEALTH_RECORDS: ${{ vars.MAX_RUN_HEALTH_RECORDS || '400' }}
          CANDIDATE_TREND_WINDOW: ${{ vars.CANDIDATE_TREND_WINDOW || '8' }}
          CANDIDATE_COLLAPSE_RATIO: ${{ vars.CANDIDATE_COLLAPSE_RATIO || '0.25' }}
          CANDIDATE_COLLAPSE_CONSECUTIVE_RUNS: ${{ vars.CANDIDATE_COLLAPSE_CONSECUTIVE_RUNS || '2' }}
          DETAIL_SUCCESS_RATE_WARNING_THRESHOLD: ${{ vars.DETAIL_SUCCESS_RATE_WARNING_THRESHOLD || '0.5' }}
          DETAIL_SUCCESS_RATE_CONSECUTIVE_RUNS: ${{ vars.DETAIL_SUCCESS_RATE_CONSECUTIVE_RUNS || '2' }}
          SOURCE_UNREACHABLE_HIGH_THRESHOLD: ${{ vars.SOURCE_UNREACHABLE_HIGH_THRESHOLD || '2' }}
          LLM_VALIDATION_HIGH_THRESHOLD: ${{ vars.LLM_VALIDATION_HIGH_THRESHOLD || '3' }}
          RUNTIME_WARNING_SECONDS: ${{ vars.RUNTIME_WARNING_SECONDS || '900' }}
        run: |
          llm_provider="${LLM_PROVIDER:-deepseek}"
          detail_args="--detail-render-mode ${DETAIL_RENDER_MODE} --max-rendered-details-per-source ${MAX_RENDERED_DETAILS_PER_SOURCE} --detail-timeout-ms ${DETAIL_TIMEOUT_MS} --detail-wait-ms ${DETAIL_WAIT_MS} --detail-max-scrolls ${DETAIL_MAX_SCROLLS} --detail-concurrency ${DETAIL_CONCURRENCY}"
          lifecycle_args="--long-absence-observation-threshold ${LONG_ABSENCE_OBSERVATION_THRESHOLD} --long-absence-min-days ${LONG_ABSENCE_MIN_DAYS} --detail-failure-attention-threshold ${DETAIL_FAILURE_ATTENTION_THRESHOLD} --max-item-versions-per-record ${MAX_ITEM_VERSIONS_PER_RECORD} --max-lifecycle-events ${MAX_LIFECYCLE_EVENTS}"
          if [ "${LLM_ENABLED}" = "true" ]; then
            if [ "${llm_provider}" = "deepseek" ]; then
              if [ -z "${DEEPSEEK_API_KEY}" ]; then
                echo "::warning::LLM 已启用，但 DEEPSEEK_API_KEY 未配置；本次将记录 skipped_no_api_key。"
              fi
              python scripts/run_weekly.py --output-mode dual --max-source-items 10 --max-history-records 20 --max-llm-usage-records 200 --enable-llm --llm-provider deepseek ${detail_args} ${lifecycle_args}
            elif [ "${llm_provider}" = "openai" ]; then
              if [ -z "${OPENAI_API_KEY}" ]; then
                echo "::warning::LLM 已启用，但 OPENAI_API_KEY 未配置；本次将记录 skipped_no_api_key。"
              fi
              python scripts/run_weekly.py --output-mode dual --max-source-items 10 --max-history-records 20 --max-llm-usage-records 200 --enable-llm --llm-provider openai ${detail_args} ${lifecycle_args}
            else
              echo "::warning::LLM_PROVIDER 无效；本次将记录 skipped_invalid_provider。"
              python scripts/run_weekly.py --output-mode dual --max-source-items 10 --max-history-records 20 --max-llm-usage-records 200 --enable-llm --llm-provider "${llm_provider}" ${detail_args} ${lifecycle_args}
            fi
          else
            python scripts/run_weekly.py --output-mode dual --max-source-items 10 --max-history-records 20 --max-llm-usage-records 200 ${detail_args} ${lifecycle_args}
          fi

      - name: Check weekly outputs
        run: |
          python scripts/check_outputs.py --strict
          echo "OUTPUT_CHECK_STATUS=passed" >> "$GITHUB_ENV"

      - name: Audit project stability
        run: |
          python scripts/audit_project.py --strict
          echo "PROJECT_AUDIT_STATUS=passed" >> "$GITHUB_ENV"

      - name: Commit generated weekly files
        run: |
          git config user.name "starlink-intel-bot"
          git config user.email "starlink-intel-bot@example.com"
          git add README.md RELEASE_NOTES.md .gitignore .github scripts tests docs weekly data/items.jsonl data/source_status.json data/extraction_quality.json data/item_extraction_state.json data/item_extraction_report.json data/detail_extraction_diagnostics.json data/item_lifecycle_state.json data/item_versions.jsonl data/lifecycle_events.jsonl data/lifecycle_report.json data/lifecycle_replay_report.json data/alert_state.json data/alert_events.jsonl data/alert_report.json data/run_health.json data/run_health_history.jsonl data/weekly_manifest.json data/run_history.jsonl data/llm_audit.json outputs/logs/.gitkeep sources.yml requirements.txt .env.example
          if [ -f data/llm_summaries.json ]; then
            git add data/llm_summaries.json
          fi
          if [ -f data/llm_usage.jsonl ]; then
            git add data/llm_usage.jsonl
          fi
          if git diff --cached --quiet; then
            echo "阶段 4D 自动化输出没有变化，跳过提交。"
          else
            git commit -m "chore: update weekly Starlink automation output"
            git push origin main
          fi

      - name: Sync to Gitee
        env:
          GITEE_REMOTE: ${{ secrets.GITEE_REMOTE }}
        run: |
          if [ -z "$GITEE_REMOTE" ]; then
            echo "GITEE_REMOTE 未配置，跳过 Gitee 同步。"
            echo "GITEE_SYNC_STATUS=skipped" >> "$GITHUB_ENV"
            exit 0
          fi

          git remote remove gitee 2>/dev/null || true
          if ! git remote add gitee "$GITEE_REMOTE" 2>/dev/null; then
            echo "::warning::Gitee remote 添加失败，已跳过，不阻断 GitHub 周报主流程。请检查 GITEE_REMOTE。"
            echo "GITEE_SYNC_STATUS=failed" >> "$GITHUB_ENV"
            exit 0
          fi

          success=0
          push_log="$(mktemp)"
          for attempt in 1 2 3; do
            echo "尝试同步到 Gitee，第 ${attempt}/3 次..."
            if git push gitee main >"$push_log" 2>&1; then
              echo "Gitee 同步成功。"
              echo "GITEE_SYNC_STATUS=success" >> "$GITHUB_ENV"
              success=1
              break
            else
              echo "::warning::Gitee 同步第 ${attempt} 次失败，可能是 Gitee 认证服务超时、网络波动或令牌权限问题。"
              sleep $((attempt * 10))
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::warning::Gitee 同步失败，已跳过，不阻断 GitHub 周报主流程。请稍后手动重新运行 workflow 或检查 GITEE_REMOTE。"
            echo "GITEE_SYNC_STATUS=failed" >> "$GITHUB_ENV"
          fi
          rm -f "$push_log"

          exit 0

      - name: Write run summary
        if: always()
        env:
          GITEE_REMOTE: ${{ secrets.GITEE_REMOTE }}
          ACTION_RUN_STATUS: ${{ job.status }}
        run: |
          python scripts/print_action_summary.py >> "$GITHUB_STEP_SUMMARY"
